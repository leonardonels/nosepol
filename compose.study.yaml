# Long rate study: the rate-study build with its shadow backends and study logs, kept
# apart from the public instance (own container, own data volume, local port only, no
# tunnel). Its real tracker polls the operator like the public one does.
#
#   docker compose -f compose.study.yaml up -d --build
#   docker compose -f compose.study.yaml logs -f
#   docker compose -f compose.study.yaml down        # the volume (and the logs) stay
#
# Report (tools/ isn't in the image: copy the logs out and run it here):
#   docker compose -f compose.study.yaml cp study:/app/data/logs ./study-logs
#   python3 tools/study_report.py study-logs
#
# To start from what the public instance has learned (stretch times, blend weights),
# before the first `up`:
#   docker compose -f compose.study.yaml run --rm --no-deps -v nosepol_nosepol-data:/from:ro study \
#     sh -c 'cp /from/speeds.json /from/blend.json data/ 2>/dev/null; ls -la data'
name: nosepol-study
services:
  study:
    build: .
    image: nosepol:study
    container_name: nosepol-study
    restart: "no"                   # same as the public one: a crash or reboot leaves it stopped
    init: true
    ports:
      - "127.0.0.1:${NOSEPOL_STUDY_PORT:-8095}:8080"
    environment:
      NOSEPOL_LOG_DIR: /app/data/logs
      NOSEPOL_SHADOWS: ${NOSEPOL_SHADOWS:-45,60,90,120,180}
    volumes:
      - study-data:/app/data        # learned data, shadow weights and logs/
    command: ["python", "server/app.py", "--port", "8080", "--lines", "${NOSEPOL_LINES:-T06,T08,T09}"]

volumes:
  study-data:
