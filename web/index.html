<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoSePol</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/app-default-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/app-default-full-180.png">
<meta name="theme-color" content="#F2F0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1F22" media="(prefers-color-scheme: dark)">
<script>try { const t = JSON.parse(localStorage.getItem("nsp.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* Liquid Glass over the map: the map is the content, glass is the control layer.
     Two materials: clear for controls (pills, chips, map buttons), regular for sheets. */
  :root {
    color-scheme: light dark;
    --tint:#0A5FD0; --on-tint:#FFFFFF;
    --label:#1D1D1F; --label2:rgba(60,60,67,.85); --label3:rgba(60,60,67,.62); --sep:rgba(60,60,67,.18);
    --fill:rgba(118,118,128,.14); --fill2:rgba(118,118,128,.22);
    --bg:#F2F0EB; --solid:#F8F8FA;
    --good:#1F7A45; --warn:#A0480F; --bad:#C4262E; --amber:#F2B33D;
    --ctl-bg:rgba(255,255,255,.26); --sheet-bg:rgba(248,248,250,.74); --scrim:rgba(248,248,250,.72);
    --rim-a:rgba(255,255,255,.95); --rim-b:rgba(255,255,255,.6); --rim-line:rgba(0,0,0,.08); --rim-glow:rgba(255,255,255,.28);
    --shadow:0 1px 2px rgba(0,0,0,.08), 0 8px 22px rgba(0,0,0,.14);
    --halo:#FFFFFF; --stop-fill:#FFFFFF; --stop-ring:#3C3C43; --pill:rgba(255,255,255,.92); --pill-ink:#3C3C43;
    --tiles:saturate(.55) brightness(1.03) contrast(.96);
    /* Material names the page script still uses, mapped onto the glass tokens */
    --md-primary:var(--tint); --md-on-primary:var(--on-tint); --md-primary-container:var(--fill2); --md-on-primary-container:var(--label);
    --md-secondary-container:var(--fill2); --md-on-secondary-container:var(--label);
    --md-error:var(--bad); --md-error-container:color-mix(in srgb, var(--bad) 18%, transparent); --md-on-error-container:var(--bad);
    --md-good:var(--good);
    --md-surface:var(--solid); --md-on-surface:var(--label); --md-on-surface-variant:var(--label2);
    --md-outline:var(--label3); --md-outline-variant:var(--sep);
    --md-surface-container-low:var(--fill); --md-surface-container:var(--fill);
    --md-surface-container-high:var(--fill); --md-surface-container-highest:var(--fill2);
    --md-inverse-surface:var(--label); --md-inverse-on-surface:var(--solid);
    --md-elev-1:0 1px 2px rgba(0,0,0,.2); --md-elev-2:var(--shadow); --md-elev-3:var(--shadow);
    --ink:var(--solid); --fg:var(--label); --muted:var(--label2);
    --lime:var(--tint); --orange:var(--warn); --line:var(--sep); --edge:var(--sep);
    --font:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --cond:var(--font); --mono:var(--font);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --tint:#7FB2FF; --on-tint:#0B1B33;
    --label:#F5F5F7; --label2:rgba(235,235,245,.72); --label3:rgba(235,235,245,.5); --sep:rgba(235,235,245,.16);
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
    --bg:#1C1F22; --solid:#1C1C20;
    --good:#30C46C; --warn:#F2B33D; --bad:#FF6369;
    --ctl-bg:rgba(36,36,42,.34); --sheet-bg:rgba(28,28,32,.7); --scrim:rgba(28,28,32,.72);
    --rim-a:rgba(255,255,255,.5); --rim-b:rgba(255,255,255,.22); --rim-line:rgba(255,255,255,.1); --rim-glow:rgba(255,255,255,.05);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.45);
    --halo:#1C1F22; --stop-fill:#1C1F22; --stop-ring:#EBEBF5; --pill:rgba(28,28,32,.92); --pill-ink:#EBEBF5;
    --tiles:invert(1) hue-rotate(180deg) brightness(.8) contrast(.9) saturate(.45);
  }
  :root[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --tint:#7FB2FF; --on-tint:#0B1B33;
      --label:#F5F5F7; --label2:rgba(235,235,245,.72); --label3:rgba(235,235,245,.5); --sep:rgba(235,235,245,.16);
      --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
      --bg:#1C1F22; --solid:#1C1C20;
      --good:#30C46C; --warn:#F2B33D; --bad:#FF6369;
      --ctl-bg:rgba(36,36,42,.34); --sheet-bg:rgba(28,28,32,.7); --scrim:rgba(28,28,32,.72);
      --rim-a:rgba(255,255,255,.5); --rim-b:rgba(255,255,255,.22); --rim-line:rgba(255,255,255,.1); --rim-glow:rgba(255,255,255,.05);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.45);
      --halo:#1C1F22; --stop-fill:#1C1F22; --stop-ring:#EBEBF5; --pill:rgba(28,28,32,.92); --pill-ink:#EBEBF5;
      --tiles:invert(1) hue-rotate(180deg) brightness(.8) contrast(.9) saturate(.45);
    }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--label);
    font:400 15px/20px var(--font); letter-spacing:-.01em; -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  button, input { font:inherit; color:inherit; letter-spacing:inherit; }
  button { cursor:pointer; }
  #map { position:fixed; inset:0; background:var(--bg); }
  .leaflet-container { font-family:var(--font); }
  .leaflet-tile-pane { filter:var(--tiles); }
  .leaflet-control-attribution { font-size:10px; border-radius:10px 0 0 0; background:var(--scrim) !important; color:var(--label2);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .leaflet-control-attribution a { color:var(--tint); }
  .route-halo { stroke:var(--halo); }
  .stop-dot { stroke:var(--stop-ring); fill:var(--stop-fill); }
  .mono { font:600 12px/16px var(--font); letter-spacing:0; color:var(--label2); }
  .cond { font-weight:600; }
  .hide { display:none !important; }
  .icon-btn { width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center;
    border:0; border-radius:50%; background:transparent; color:var(--label); }
  .icon-btn:hover { background:var(--fill); }

  /* the two materials */
  .glass { position:relative; isolation:isolate; background:var(--ctl-bg);
    -webkit-backdrop-filter:blur(8px) saturate(180%); backdrop-filter:blur(8px) saturate(180%);
    box-shadow:inset 1.5px 1.5px 1px -1px var(--rim-a), inset -1px -1px 1px -.5px var(--rim-b),
      inset 0 0 0 .5px var(--rim-line), inset 0 0 16px var(--rim-glow), var(--shadow); }
  .glass::before { content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
    background:linear-gradient(135deg, var(--rim-a) 0%, transparent 28%, transparent 70%, var(--rim-b) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; }
  .glass.regular { background:var(--sheet-bg); -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%); }
  /* no blur support, or the user asked for less transparency: the same colours, solid */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
    .glass, .glass.regular, .overlay { background:var(--solid); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass, .glass.regular, .overlay { background:var(--solid); -webkit-backdrop-filter:none; backdrop-filter:none; }
  }

  /* top: search capsule, then the GPS pill's line filter */
  #top { position:fixed; z-index:1000; top:0; left:0; right:0; padding:12px 12px 0;
    padding-top:max(12px, env(safe-area-inset-top)); display:flex; flex-direction:column; align-items:flex-start; gap:10px; pointer-events:none; }
  #top > * { pointer-events:auto; }
  .bar { align-self:stretch; display:flex; align-items:center; gap:2px; height:52px; padding:0 4px; border-radius:999px; }
  .field { flex:1; min-width:0; height:52px; display:flex; align-items:center; gap:10px; padding:0 12px;
    background:none; border:0; border-radius:999px; color:var(--label2); text-align:left; font-size:16px; }
  .sq { width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center;
    background:transparent; border:0; border-radius:50%; color:var(--label); }
  #live { width:auto; height:36px; padding:0 10px; border-radius:999px; font:700 13px/16px var(--font); color:var(--label); background:transparent; }
  #live::first-letter { color:var(--good); }
  #live.bad, #live.bad::first-letter { color:var(--bad); }
  #chips { display:flex; gap:6px; max-width:100%; overflow-x:auto; scrollbar-width:none; padding:6px; border-radius:999px; }
  #chips:empty { display:none; }
  #chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; height:32px; min-width:32px; display:flex; align-items:center; justify-content:center; padding:0 10px; border-radius:999px;
    border:0; background:color-mix(in srgb, var(--c) 20%, transparent); color:var(--label); box-shadow:inset 0 0 0 1.5px var(--c);
    font:800 14px/1 var(--font); }
  .chip .dot { display:none; }
  .chip[aria-pressed=true] { background:var(--c); color:var(--k); box-shadow:none; }

  /* map controls: one glass stack, locate over the compass */
  #ctrl { position:fixed; z-index:1000; right:12px; top:calc(max(12px, env(safe-area-inset-top)) + 62px);
    width:48px; padding:2px 0; border-radius:24px; display:flex; flex-direction:column; align-items:center; }
  #ctrl hr { width:26px; height:0; margin:0; border:0; border-top:.5px solid var(--label3); }
  #locate, #compass { width:44px; height:44px; border:0; padding:0; border-radius:50%; background:transparent; color:var(--label);
    display:flex; align-items:center; justify-content:center; }
  #compass { transition:opacity .2s; }
  #compass.north { opacity:.6; }

  /* map markers: the colour is always the line; state is an outline, a badge or opacity */
  .bus { position:relative; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%;
    font:800 13px/1 var(--font); box-shadow:0 0 0 2.5px #fff, 0 2px 6px rgba(0,0,0,.32); }
  .bus .arrow { position:absolute; left:50%; top:50%; width:20px; height:18px; margin:-9px 0 0 -10px; display:block; }
  .bus .arrow path { fill:var(--c); stroke:#fff; stroke-width:1.5; stroke-linejoin:round; }
  .bus.sel { box-shadow:0 0 0 2.5px #fff, 0 0 0 6px var(--tint), 0 2px 6px rgba(0,0,0,.32); }
  /* run number bottom right; status (stopped time, next departure) top left */
  .bus .run { position:absolute; left:calc(100% - 8px); bottom:-11px; height:16px; padding:0 5px; border-radius:999px; white-space:nowrap;
    font:700 10px/16px var(--font); letter-spacing:0; background:var(--pill); color:var(--pill-ink);
    box-shadow:0 1px 2px rgba(0,0,0,.25); pointer-events:none; }
  #map.far .bus .run { display:none; }
  .bus .flag { position:absolute; right:calc(100% - 8px); top:-10px; min-width:16px; height:16px; padding:0 5px; border-radius:999px;
    font:800 10px/16px var(--font); text-align:center; white-space:nowrap; }
  .bus.midroute { box-shadow:0 0 0 2.5px #fff, 0 0 0 5px var(--amber), 0 2px 6px rgba(0,0,0,.32); }
  .bus.midroute .flag { background:var(--amber); color:#1B1B1F; }
  .bus.terminus, .bus.layover { opacity:.85; }
  .bus.terminus .flag, .bus.layover .flag { background:var(--label); color:var(--solid); }
  .bus.midroute .arrow, .bus.terminus .arrow, .bus.layover .arrow { display:none; }
  .bus.stale { opacity:.45; }
  /* on a stretch no stop reports on: position dead-reckoned from its last GPS */
  .bus.blind { opacity:.75; outline:2px dashed var(--c); outline-offset:3px; }
  /* no recent GPS: placed by its timetable and delay; a ghost never had GPS at all */
  .bus.est { opacity:.8; outline:2px dashed var(--c); outline-offset:3px; }
  .bus.ghost { background:var(--solid) !important; color:var(--label) !important; border:2px dashed var(--c); opacity:.9; }
  /* a scheduled departure no known bus will take: hollow and dashed, at the terminus */
  .bus.pending { background:var(--solid) !important; color:var(--label) !important; border:2px dashed var(--c);
    box-shadow:0 0 0 2px var(--halo), 0 1px 4px rgba(0,0,0,.2); }
  .bus.pending .flag { background:var(--pill); color:var(--pill-ink); box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .bus.pending.late .flag, .lbus.pending.late { color:var(--warn); }
  .selstop { width:20px; height:20px; border-radius:50%; background:#fff; border:4px solid var(--tint);
    box-shadow:0 0 0 12px color-mix(in srgb, var(--tint) 18%, transparent), 0 2px 6px rgba(0,0,0,.3); }
  .me { width:18px; height:18px; border-radius:50%; background:#1A73E8; border:3px solid #fff; box-shadow:0 0 0 8px rgba(26,115,232,.2); }

  /* the sheet: regular glass floating over the map */
  #sheet { position:fixed; z-index:1000; left:8px; right:8px; bottom:calc(8px + var(--safe-b)); max-height:52vh;
    display:flex; flex-direction:column; border-radius:36px; overflow:hidden; transition:max-height .25s ease; }
  #sheet.full { max-height:calc(88vh - var(--safe-b)); }
  #sheet.min { max-height:calc(28px + 30px); }
  #sheet.min #sheetBody { overflow:hidden; }
  #sheet.drag { transition:none; }
  #grab { flex:none; height:28px; width:100%; border:0; background:none; display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:grab; border-radius:36px 36px 0 0; }
  #grab span { width:36px; height:5px; border-radius:3px; background:var(--label3); opacity:.7; }
  /* the scroll area stops short of the rounded bottom corners, so its scrollbar can't run past them */
  #sheetBody { overflow:auto; padding:0 12px 4px 18px; margin:0 6px 18px 0; }
  .kicker { color:var(--label2); display:flex; justify-content:space-between; gap:8px; align-items:center; }
  h2 { margin:2px 0 0; font:800 24px/28px var(--font); letter-spacing:-.03em; }
  .sub { color:var(--label2); font-size:14px; margin-top:4px; }
  .row { display:flex; align-items:center; gap:12px; min-height:58px; border:0; border-radius:14px;
    background:none; padding:8px 8px; margin:0 -8px; width:calc(100% + 16px); text-align:left; color:var(--label); }
  .row:not(:disabled):hover { background:var(--fill); }
  .row:not(:disabled):active { background:var(--fill2); }
  .badge { flex:none; min-width:32px; height:28px; padding:0 7px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    background:var(--c); color:var(--k); font:800 15px/1 var(--font); }
  .grow { flex:1; min-width:0; }
  .grow b { display:block; font:700 16px/22px var(--font); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note { font:400 13px/18px var(--font); color:var(--label2); }
  .etac { flex:none; display:flex; flex-direction:column; align-items:flex-end; min-width:64px; }
  .eta { font:800 24px/28px var(--font); letter-spacing:-.03em; min-width:48px; text-align:right; }
  .op { font:500 12px/16px var(--font); color:var(--label2); min-width:64px; text-align:right; }
  .etac .op { min-width:0; white-space:nowrap; }
  .eta.sm { font:700 16px/22px var(--font); letter-spacing:-.01em; }
  .faded { opacity:.62; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-top:16px; }
  .grid > div { background:var(--fill); border-radius:16px; padding:12px 14px; min-width:0; }
  .grid .v { font:800 22px/28px var(--font); letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .btn { height:44px; padding:0 20px; border-radius:999px; border:0; background:var(--fill);
    color:var(--label); font:600 15px/20px var(--font); }
  .btn:hover { background:var(--fill2); }
  .btn.primary { background:var(--tint); color:var(--on-tint); }
  .btn.primary:hover { background:color-mix(in srgb, var(--tint) 88%, var(--label)); }
  .btn.on { background:var(--label); color:var(--solid); }
  .empty { color:var(--label2); padding:16px 0; font-size:14px; }
  .later { font-size:14px; color:var(--label2); padding:12px 0 4px; line-height:22px; }
  .pchips { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .pchip { display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 12px 0 4px; border-radius:999px;
    background:var(--fill); font:700 14px/20px var(--font); }
  .pchip .badge { min-width:26px; height:26px; border-radius:999px; font-size:12px; padding:0 6px; }
  .pchip.sched { background:transparent; box-shadow:inset 0 0 0 1px var(--sep); color:var(--label2); }
  .mini { display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:24px; padding:0 6px; border-radius:8px; font:800 12px/1 var(--font); }

  /* overlays: search, menu, line page. The map shows through, blurred */
  .overlay { position:fixed; z-index:1100; inset:0; background:var(--scrim); display:flex; flex-direction:column;
    -webkit-backdrop-filter:blur(30px) saturate(160%); backdrop-filter:blur(30px) saturate(160%);
    padding-top:env(safe-area-inset-top); }
  .ohead { display:flex; gap:6px; padding:10px 10px 8px 16px; align-items:center; min-height:64px; width:100%; max-width:640px; margin:0 auto; }
  .ohead input { flex:1; min-width:0; height:48px; border-radius:999px; background:var(--fill);
    border:0; padding:0 20px; outline:none; font-size:16px; }
  .ohead input:focus { box-shadow:inset 0 0 0 2px var(--tint); }
  .otitle { flex:1; font:800 22px/28px var(--font); letter-spacing:-.03em; }
  .obody { overflow:auto; padding:4px 16px calc(24px + var(--safe-b)); width:100%; max-width:640px; margin:0 auto; }
  .obody h3 { font:700 13px/18px var(--font); color:var(--label2); margin:24px 0 8px; }
  .obody p { color:var(--label2); font-size:14px; line-height:20px; margin:6px 0; }
  .seg { display:inline-flex; padding:3px; gap:2px; border-radius:999px; background:var(--fill); }
  .seg button { height:34px; padding:0 16px; border:0; border-radius:999px; background:none; font:600 14px var(--font); color:var(--label); }
  .seg button[aria-pressed=true] { background:var(--solid); box-shadow:0 1px 3px rgba(0,0,0,.16); }
  .stat { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:8px; }
  .stat > div { background:var(--fill); border-radius:16px; padding:12px; }
  .stat .v { font:800 22px/28px var(--font); letter-spacing:-.02em; }
  a { color:var(--tint); }
  /* thin, theme-coloured scrollbars with no arrow buttons */
  /* Chromium drops its ::-webkit-scrollbar rules (and shows arrow buttons) once scrollbar-width is set,
     so the standard properties are only for browsers without them (Firefox) */
  @supports not selector(::-webkit-scrollbar) {
    #sheetBody, .obody { scrollbar-width:thin; scrollbar-color:var(--label3) transparent; }
  }
  #sheetBody::-webkit-scrollbar, .obody::-webkit-scrollbar { width:6px; }
  #sheetBody::-webkit-scrollbar-thumb, .obody::-webkit-scrollbar-thumb { border-radius:3px; background:var(--label3); }
  #sheetBody::-webkit-scrollbar-track, .obody::-webkit-scrollbar-track { background:transparent; }
  #sheetBody::-webkit-scrollbar-track { margin:4px 0; }
  #sheetBody::-webkit-scrollbar-button, .obody::-webkit-scrollbar-button { display:none; }
  /* line page: both directions as two strips, buses placed along them */
  .ltabs { flex:1; min-width:0; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:4px 2px; }
  .ltab { flex:none; min-width:52px; height:40px; padding:0 16px; border-radius:999px; border:0; background:color-mix(in srgb, var(--c) 20%, transparent);
    box-shadow:inset 0 0 0 2px var(--c); font:800 16px/20px var(--font); color:var(--label); }
  .ltab[aria-selected=true] { background:var(--c); color:var(--k); box-shadow:none; }
  #lineBody { width:100%; max-width:560px; margin:0 auto; }
  .thead { display:flex; justify-content:space-between; gap:8px; margin-top:20px; font:700 12px/16px var(--font); color:var(--label2); }
  .thead span:last-child { text-align:right; }
  .track { position:relative; margin-top:4px; }
  .track .strip { position:absolute; width:6px; border-radius:3px; background:var(--c); }
  .track .tick { position:absolute; width:12px; height:3px; margin-top:-1.5px; border-radius:2px; background:var(--label); }
  .trow { position:absolute; left:100px; right:100px; height:36px; margin-top:-18px; display:flex; align-items:center; justify-content:center;
    padding:0 4px; border:0; border-radius:10px; background:none; color:var(--label); font:500 13px/16px var(--font); }
  .trow span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trow.end { font-weight:800; }

// Where visible lines run along the same street, draw that stretch once per line as

      const id = segs.push([l, p[i][0], p[i][1], p[i + 1][0], p[i + 1][1]]) - 1;
      const [x0, x1] = [Math.min(p[i][0], p[i + 1][0]) - SHARED_M, Math.max(p[i][0], p[i + 1][0]) + SHARED_M];
      const [y0, y1] = [Math.min(p[i][1], p[i + 1][1]) - SHARED_M, Math.max(p[i][1], p[i + 1][1]) + SHARED_M];
      for (let cx = Math.floor(x0 / CELL); cx <= Math.floor(x1 / CELL); cx++)
        for (let cy = Math.floor(y0 / CELL); cy <= Math.floor(y1 / CELL); cy++) {

    for (let i = 0; i < c.length - 1; i++) {

      chunk.push(c[i + 1]); acc += segLen;

let chipsKey = "";

async function loadShapes() {

    L.polyline(v.coords, { color: s.color, weight: 4, opacity: 1, interactive: false }).addTo(g);

function stopVisibility() { map.getZoom() >= 15 ? stopLayer.addTo(map) : stopLayer.remove(); }

const sheet = $("sheet"), body = $("sheetBody");

const sheetHeight = () => sheet.classList.contains("full") ? "full" : sheet.classList.contains("min") ? "min" : "normal";

(() => {

  };

function peek() {

  clearTimers();
  sel = null; follow = false; setHeight("normal");

  drawBuses();

    setSheet(`<div class="kicker mono"><span>NoSePol · Trieste</span></div>
      <p class="sub" style="margin:8px 0 12px">${esc(t("tapHint"))} ${esc(t("locHint"))}</p>
      <button class="btn" id="useLoc" style="width:100%">${esc(t("locBtn"))}</button>`);
    $("useLoc").onclick = locate;
    return;
  }
  api(`stops?near=${me[0].toFixed(5)},${me[1].toFixed(5)}&limit=1`).then(async ([st]) => {
    if (!st || sel) return;

    if (sel) return;

    setSheet(`<button class="row" id="peekStop" style="border-top:0; display:block">
        <div class="kicker mono"><span>${esc(t("nearest"))} · ${fmtDist(st.dist)} · ${walkMin(st.dist)}′ ${esc(t("walk"))}</span></div>

        icon: L.divIcon({ className: "", html: '<div class="selstop"></div>', iconSize: [22, 22] }) }).addTo(map);
      if (pan) requestAnimationFrame(() => focusOn([d.lat, d.lon], 16));
    }

    const rows = d.departures.map(x => {
      const eta = x.eta_s != null ? fmtEta(x.eta_s) : x.stopped_s ? stopShort(x) : x.live ? "–"
        : x.operator_eta_s != null ? fmtEta(x.operator_eta_s) : (x.scheduled || "–");

        : `${t("scheduled")}${x.scheduled ? " " + x.scheduled : ""}${x.waiting_bus ? " · " + t("busWaiting") : ""}`;
      const ours = x.eta_s != null || !!x.stopped_s || x.live || x.ghost;  // our estimate: big; the operator's or the timetable: small
      const warn = x.stop_kind === "midroute" && x.stopped_s >= ALARM_S ? ' style="color:var(--orange)"' : "";

        ${badge(x.line)}<div class="grow"><b>${esc(x.destination)}</b><span class="note"${warn}>${esc(note)}</span></div>
        <span class="etac"><span class="eta${ours ? "" : " sm"}"${warn}>${!ours && x.operator_eta_s != null ? "TPL " : ""}${esc(eta)}</span>${x.operator && x.eta_s != null ? `<span class="op">TPL ${esc(x.operator)}</span>` : ""}</span></button>`;
    }).join("");

    setSheet(`<div class="kicker mono"><span>${esc(t("stop"))}${walk != null ? ` · ${fmtDist(walk)} · ${walkMin(walk)}′ ${esc(t("walk"))}` : ""}</span>

      <h2>${esc(d.name)}</h2>
      <div style="display:flex;gap:6px;margin-top:8px">${d.lines.map(l => `<button class="lineLink" data-line="${esc(base(l))}" aria-label="${esc(t("lineN", { n: style(l).name }))}" style="border:0;padding:0;background:none;border-radius:50%">${badge(l)}</button>`).join("")}</div>
      <div style="margin-top:12px">${rows || `<p class="empty">${esc(t("noBuses"))}</p>`}</div>
      ${later ? `<div class="later"><div class="mono" style="color:var(--muted);margin-bottom:4px">${esc(t("later"))}</div>${later}</div>` : ""}

async function openBus(trip, { pan = true, from = null } = {}) {

  const sub = [waiting ? t("atTermN", { n: waiting }) : "", starts ? t("startsN", { n: starts }) : ""].filter(Boolean).join(" · ");
  const c = `--c:${d.color};--k:${d.ink}`;
  const H = TOP * 2 + (A.stops.length - 1) * ROW;
  const y = row => TOP + row * ROW;
  const rmap = R ? rowMap(A.stops, R.stops) : [];
  const rowOf = (dir, s) => {
    const f = fracIndex(dir.stops, s);
    if (dir === A) return f;
    const i = Math.floor(f), k = f - i;
    return rmap[i] + (rmap[Math.min(i + 1, rmap.length - 1)] - rmap[i]) * k;
  };
  let html = "";
  // stop names, and ticks for each direction's own stops
  A.stops.forEach((st, i) => {
    html += `<button class="trow ${i === 0 || i === A.stops.length - 1 ? "end" : ""}" style="top:${y(i)}px" ${st.code ? `data-stop="${esc(st.code)}"` : "disabled"} title="${esc(st.name)}"><span>${esc(st.name)}</span></button>`;
    html += `<span class="tick" style="left:27px;top:${y(i)}px"></span>`;
  });
  if (R) R.stops.forEach((st, j) => { html += `<span class="tick" style="right:27px;top:${y(rmap[j])}px"></span>`; });
  html += `<span class="strip" style="left:30px;top:${TOP}px;height:${H - 2 * TOP}px"></span>`;
  if (R) html += `<span class="strip" style="right:30px;top:${TOP}px;height:${H - 2 * TOP}px"></span>`;
  // buses: front first; down on the left, up on the right; nudge apart when they'd overlap
  for (const dir of d.directions.slice(0, 2)) {
    const left = dir === A, side = left ? "left" : "right", sign = left ? 1 : -1;
    let prev = null, prevRun = null;
    const place = yy => { if (prev != null && (prev - yy) * sign < BUS_H) yy = prev - sign * BUS_H; return (prev = yy); };
    for (const b of dir.buses) {
      const yy = place(y(rowOf(dir, b.s)));
      const wait = b.stop_kind === "layover" || b.stop_kind === "terminus";
      const mid = b.stop_kind === "midroute" && b.stopped_s >= ALARM_S;
      const fl = wait && b.next_run ? `<span class="fl">${esc(b.next_run.scheduled)}</span>`
        : b.stopped_s && !wait ? `<span class="fl ${mid ? "bad" : ""}">${mid ? "!" : ""}${fmtMin(b.stopped_s)}</span>` : "";
      const title = [`${d.name} ${t("to")} ${b.to}`, b.short ? t("shortTrip", { dest: b.to }) : "", b.stopped_s ? stopText(b) : "", b.blind ? t("blind") : "", estText(b)].filter(Boolean).join(" · ");
      html += `<button class="lbus ${b.short ? "short" : ""} ${b.blind ? "blind" : ""} ${b.stale ? "stale" : ""} ${wait ? "wait" : ""} ${b.ghost ? "ghost" : b.estimated ? "est" : ""}" data-trip="${esc(b.trip)}"
        style="${side}:44px;top:${yy}px" title="${esc(title)}" aria-label="${esc(title)}">${left ? "▼" : "▲"} ${esc(String(b.trip).split(":")[1] ?? b.trip)}${fl}</button>`;
      // gap to the running bus ahead, as a bracket beside the strip
      if (running(b)) {
        if (prevRun && prevRun.gap_s != null) {
          const [y0, y1] = [prevRun.y, yy].sort((p, q) => p - q);
          const g = prevRun.gap_s, cls = g < BUNCH_S ? "bunch" : isHole(g, med, gaps.length) ? "hole" : "";
          html += `<span class="lgap ${left ? "l" : "r"} ${cls}" style="${side}:0;top:${y0}px;height:${Math.max(y1 - y0, 14)}px;${y1 - y0 < 14 ? "margin-top:-7px" : ""}"
            title="${esc(t("gapTitle", { m: fmtMin(g) }))}"><b>${esc(fmtMin(g))}</b></span>`;
        }
        prevRun = { ...b, y: yy };
      }
    }
    // departures due from this direction's first stop that no known bus will take
    const y0 = y(rowOf(dir, 0));
    dir.pending.forEach((p, k) => {
      html += `<span class="lbus pending${isLate(p) ? " late" : ""}" style="${side}:${44 + k * 66}px;top:${y0 - sign * BUS_H}px" title="${esc(pendingText(p))}">${esc(p.scheduled)}</span>`;
    });
  }
  const shortEnds = [...new Set(all.filter(b => b.short).map(b => b.to))];
  const busy = d.directions.some(x => x.pending.length);
  $("lineBody").innerHTML = `
    <div class="kicker mono"><span>${esc(t("lineN", { n: d.name }))}</span></div>
    <h2>${d.directions.map(x => esc(x.headsign)).join(" ⇄ ")}</h2>
    ${sub ? `<div class="sub">${esc(sub)}</div>` : ""}
    <div class="stat">
      <div><div class="mono" style="color:var(--muted)">${esc(t("running"))}</div><div class="v">${run.length}</div></div>
      <div><div class="mono" style="color:var(--muted)">${esc(t("avgGap"))}</div><div class="v">${med == null ? "–" : fmtMin(med)}</div></div>
      <div><div class="mono" style="color:var(--muted)">${esc(t("lineStatus"))}</div><div class="v" style="color:${status[1]}">${esc(status[0])}</div></div>
    </div>
    <div class="actions"><button class="btn" id="lineMap">${esc(t("showOnMap"))}</button><button class="btn" id="lineShare">${esc(t("share"))}</button></div>
    ${all.length ? "" : `<p class="empty">${esc(t("noLive"))}</p>`}
    <div class="thead"><span>▼ ${esc(A.headsign)}</span>${R ? `<span>▲ ${esc(R.headsign)}</span>` : ""}</div>
    <div class="track" style="${c};height:${H + (busy ? BUS_H : 0)}px;${busy ? `margin-top:${BUS_H + 4}px` : ""}">${html}</div>
    <p class="note" style="margin-top:12px">${esc(t("lineHint"))}${shortEnds.length ? " " + esc(t("shortLegend", { ends: shortEnds.join(", ") })) : ""}</p>`;
  $("lineMap").onclick = () => { closeLine(); showOnly(line); };
  $("lineShare").onclick = share;
  for (const b of $("lineBody").querySelectorAll("[data-stop]")) b.onclick = () => { closeLine(); openStop(b.dataset.stop); };
  for (const b of $("lineBody").querySelectorAll(".lbus[data-trip]")) b.onclick = () => { closeLine(); openBus(b.dataset.trip); };
}
$("closeLine").onclick = closeLine;

// ---------- location ----------
function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    me = [p.coords.latitude, p.coords.longitude];
    if (!meMarker) meMarker = L.marker(me, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16] }), interactive: false }).addTo(map);
    else meMarker.setLatLng(me);
    focusOn(me, 16);
    if (!sel) peek();
  }, () => toast(t("locHint")), { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
}
$("locate").onclick = locate;

// ---------- routing & polling ----------
function route() {
  const m = location.hash.match(/^#\/(stop|bus|line)\/(.+)$/);
  if (!m) { closeLine(); return onboard ? openBus(onboard.trip) : peek(); }
  const id = decodeURIComponent(m[2]);
  if (m[1] === "line") return openLine(id);
  closeLine();
  m[1] === "stop" ? openStop(id) : openBus(id);
}
function rerender() { if (lineOpen) openLine(lineOpen); if (sel?.type === "stop") openStop(sel.id, { pan: false }); else if (sel?.type === "bus") openBus(sel.id, { pan: false }); else peek(); drawBuses(); }
window.addEventListener("hashchange", () => { if (!location.hash.startsWith(lineOpen ? "#/line/" : `#/${sel?.type}/`)) route(); });

// Live updates: one server-sent event every ~3 s (vehicles, last GPS batch, route count).
// If the stream can't open or goes quiet, poll the same data instead. Nothing runs while
// the page is hidden, to keep traffic down.
let knownVariants = -1, streamVariants = -1, linesAt = 0;
let lastBatch = null, batchEvery = null, online = false;
async function apply(data, receivedAt) {
  vehicles = data.vehicles;
  pendingDeps = data.pending || [];
  drawBuses();
  if (follow && sel?.type === "bus") { const v = vehicles.find(x => x.trip === sel.id); if (v) focusOn([v.lat, v.lon], 0); }
  // the batch time in this phone's clock, so a skewed clock doesn't matter
  // (until the server has seen a batch change since it started, use the freshest bus's GPS age)
  const freshest = Math.min(...data.vehicles.map(v => v.age).filter(a => a != null));
  lastBatch = data.last_batch != null ? receivedAt - (data.t - data.last_batch) : isFinite(freshest) ? receivedAt - freshest : null;
  batchEvery = data.batch_interval ?? batchEvery;
  online = true; paintLive();
  if (data.variants !== streamVariants || Date.now() - linesAt > 60000) {
    // data.variants goes up whenever a route is added, changed or dropped
    const changed = streamVariants !== -1 && data.variants !== streamVariants;
    streamVariants = data.variants; linesAt = Date.now();
    const nv = await loadLines();
    if (changed || nv !== knownVariants) { knownVariants = nv; await loadShapes(); }
  }
}
// "● 12 s": seconds since the last GPS batch, counting up between updates
function paintLive() {
  const el = $("live");
  if (!online) { el.textContent = "● ✕"; el.classList.add("bad"); el.title = t("offline"); return; }
  if (lastBatch == null) { el.textContent = "● —"; el.classList.remove("bad"); el.title = liveText(); return; }
  const age = Math.max(0, Math.round(Date.now() / 1000 - lastBatch));
  el.textContent = `● ${age} s`;
  el.classList.toggle("bad", age > Math.max(60, 3 * (batchEvery || 20)));
  el.title = liveText();
}
const liveText = () => !online ? t("offline") : lastBatch == null ? t("noBatch")
  : t(batchEvery ? "lastBatchAt" : "lastBatchAt0", { s: batchEvery,
      time: new Date(lastBatch * 1000).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }) });
$("live").onclick = () => toast(liveText());
setInterval(paintLive, 1000);

let stream = null, lastMsg = 0, pollTimer = null;
async function poll() {
  try { await apply(await api("live"), Date.now() / 1000); }
  catch { online = false; paintLive(); }
}
function startPolling() { if (!pollTimer) { poll(); pollTimer = setInterval(poll, 3000); } }
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
function connect() {
  if (stream || document.hidden) return;
  if (!window.EventSource) return startPolling();
  stream = new EventSource("api/stream");
  stream.onmessage = e => { lastMsg = Date.now(); stopPolling(); apply(JSON.parse(e.data), Date.now() / 1000); };
  stream.onerror = () => {
    startPolling();  // EventSource retries by itself; poll meanwhile
    if (stream.readyState === EventSource.CLOSED) { stream = null; setTimeout(connect, 60000); }  // refused (e.g. busy)
  };
}
function disconnect() { stream?.close(); stream = null; stopPolling(); }
// a stream that's open but silent (a proxy holding it back): poll until it speaks again
setInterval(() => { if (stream && !document.hidden && Date.now() - lastMsg > 8000) startPolling(); }, 3000);
document.addEventListener("visibilitychange", () => document.hidden ? disconnect() : connect());

applyLang();
stopVisibility();
runVisibility();
addEventListener("load", () => map.invalidateSize());  // fonts/viewport can settle after init
poll().then(route);
connect();
</script>
</body>
</html>
