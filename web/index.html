<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoSePol</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F9F9FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<script>try { const t = JSON.parse(localStorage.getItem("nsp.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  /* Material 3 tokens (scheme from a calm blue seed), light and dark */
  :root {
    color-scheme: light dark;
    --md-primary:#415F91; --md-on-primary:#FFFFFF; --md-primary-container:#D6E3FF; --md-on-primary-container:#001B3E;
    --md-secondary-container:#DAE2F9; --md-on-secondary-container:#131C2B;
    --md-error:#BA1A1A; --md-error-container:#FFDAD6; --md-on-error-container:#410002;
    --md-good:#1B6C3A;
    --md-surface:#F9F9FF; --md-on-surface:#191C20; --md-on-surface-variant:#44474E;
    --md-outline:#74777F; --md-outline-variant:#C4C6D0;
    --md-surface-container-low:#F3F3FA; --md-surface-container:#EDEDF4;
    --md-surface-container-high:#E7E8EE; --md-surface-container-highest:#E2E2E9;
    --md-inverse-surface:#2E3036; --md-inverse-on-surface:#F0F0F7;
    --halo:#FFFFFF; --stop-fill:#FFFFFF; --stop-ring:#44474E;
    --md-elev-1:0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
    --md-elev-2:0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);
    --md-elev-3:0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3);
    /* names the page script uses */
    --ink:var(--md-surface); --fg:var(--md-on-surface); --muted:var(--md-on-surface-variant);
    --lime:var(--md-primary); --orange:var(--md-error); --line:var(--md-outline-variant); --edge:var(--md-outline-variant);
    --cond:Roboto, system-ui, sans-serif; --mono:Roboto, system-ui, sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  /* dark: when the user picks it, or follows a dark system setting */
  :root[data-theme="dark"] {
    color-scheme: dark;
      --md-primary:#AAC7FF; --md-on-primary:#0A305F; --md-primary-container:#284777; --md-on-primary-container:#D6E3FF;
      --md-secondary-container:#3E4759; --md-on-secondary-container:#DAE2F9;
      --md-error:#FFB4AB; --md-error-container:#93000A; --md-on-error-container:#FFDAD6;
      --md-good:#8BD89B;
      --md-surface:#111318; --md-on-surface:#E2E2E9; --md-on-surface-variant:#C4C6D0;
      --md-outline:#8E9099; --md-outline-variant:#44474E;
      --md-surface-container-low:#191C20; --md-surface-container:#1D2024;
      --md-surface-container-high:#282A2F; --md-surface-container-highest:#33353A;
      --md-inverse-surface:#E2E2E9; --md-inverse-on-surface:#2E3036;
      --halo:#1D2024; --stop-fill:#C4C6D0; --stop-ring:#1D2024;
  }
  :root[data-theme="dark"] .leaflet-tile-pane { filter:brightness(.82) saturate(.75); }
  :root[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --md-primary:#AAC7FF; --md-on-primary:#0A305F; --md-primary-container:#284777; --md-on-primary-container:#D6E3FF;
      --md-secondary-container:#3E4759; --md-on-secondary-container:#DAE2F9;
      --md-error:#FFB4AB; --md-error-container:#93000A; --md-on-error-container:#FFDAD6;
      --md-good:#8BD89B;
      --md-surface:#111318; --md-on-surface:#E2E2E9; --md-on-surface-variant:#C4C6D0;
      --md-outline:#8E9099; --md-outline-variant:#44474E;
      --md-surface-container-low:#191C20; --md-surface-container:#1D2024;
      --md-surface-container-high:#282A2F; --md-surface-container-highest:#33353A;
      --md-inverse-surface:#E2E2E9; --md-inverse-on-surface:#2E3036;
      --halo:#1D2024; --stop-fill:#C4C6D0; --stop-ring:#1D2024;
    }
    :root:not([data-theme="light"]) .leaflet-tile-pane { filter:brightness(.82) saturate(.75); }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--md-surface); color:var(--md-on-surface);
    font:400 14px/20px Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing:.25px;
    font-variant-numeric:tabular-nums; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  button, input { font:inherit; color:inherit; letter-spacing:inherit; }
  button { cursor:pointer; }
  #map { position:fixed; inset:0; background:var(--md-surface-container); }
  .leaflet-tile-pane { filter:saturate(.8); }
  .leaflet-control-attribution { font-size:10px; border-radius:8px 0 0 0; background:color-mix(in srgb, var(--md-surface-container) 85%, transparent) !important; color:var(--md-on-surface-variant); }
  .leaflet-control-attribution a { color:var(--md-primary); }
  .route-halo { stroke:var(--halo); }
  .stop-dot { stroke:var(--stop-ring); fill:var(--stop-fill); }
  .mono { font:500 12px/16px Roboto, system-ui, sans-serif; letter-spacing:.5px; color:var(--md-on-surface-variant); }
  .cond { font-weight:500; }
  .hide { display:none !important; }
  .icon-btn { width:48px; height:48px; flex:none; display:flex; align-items:center; justify-content:center;
    border:0; border-radius:50%; background:transparent; color:var(--md-on-surface-variant); }
  .icon-btn:hover { background:color-mix(in srgb, var(--md-on-surface) 8%, transparent); }

  /* top: M3 search bar + filter chips */
  #top { position:fixed; z-index:1000; top:0; left:0; right:0; padding:12px 16px 0;
    padding-top:max(12px, env(safe-area-inset-top)); display:flex; flex-direction:column; gap:10px; pointer-events:none; }
  #top > * { pointer-events:auto; }
  .bar { display:flex; align-items:center; gap:4px; height:56px; padding:0 4px 0 4px; border-radius:28px;
    background:var(--md-surface-container-high); box-shadow:var(--md-elev-2); }
  .field { flex:1; min-width:0; height:56px; display:flex; align-items:center; gap:16px; padding:0 12px;
    background:none; border:0; border-radius:28px; color:var(--md-on-surface-variant); text-align:left; font-size:16px; }
  .sq { width:48px; height:48px; flex:none; display:flex; align-items:center; justify-content:center;
    background:transparent; border:0; border-radius:50%; color:var(--md-on-surface-variant); }
  #live { width:auto; height:32px; padding:0 12px; border-radius:16px; font:500 12px/16px Roboto, sans-serif;
    background:var(--md-secondary-container); color:var(--md-on-secondary-container); }
  #live.bad { background:var(--md-error-container); color:var(--md-on-error-container); }
  #chips { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px 2px 6px; }
  #chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; height:32px; display:flex; align-items:center; gap:8px; padding:0 16px 0 8px; border-radius:8px;
    border:1px solid var(--md-outline-variant); background:var(--md-surface-container-low); color:var(--md-on-surface-variant);
    font:500 14px/20px Roboto, sans-serif; box-shadow:var(--md-elev-1); }
  .chip .dot { width:18px; height:18px; border-radius:50%; border:2px solid var(--c); background:transparent; }
  .chip[aria-pressed=true] { background:var(--md-secondary-container); color:var(--md-on-secondary-container); border-color:transparent; }
  .chip[aria-pressed=true] .dot { background:var(--c); }

  /* map markers */
  .bus { position:relative; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%;
    font:700 14px/1 Roboto, sans-serif; box-shadow:0 0 0 2px var(--halo), var(--md-elev-2); }
  .bus .arrow { position:absolute; left:50%; top:50%; width:20px; height:18px; margin:-9px 0 0 -10px; display:block; }
  .bus .arrow path { fill:var(--c); stroke:#1B1B1F; stroke-width:1.5; stroke-linejoin:round; }
  .bus.sel { box-shadow:0 0 0 2px var(--halo), 0 0 0 5px var(--md-primary), var(--md-elev-2); }
  /* run number (the :xxx of the trip) bottom right; status (stopped time, next departure) top left */
  .bus .run { position:absolute; left:calc(100% - 8px); bottom:-11px; height:15px; padding:0 4px; border-radius:8px; white-space:nowrap;
    font:500 10px/15px Roboto, sans-serif; letter-spacing:0; background:var(--md-surface-container-highest); color:var(--md-on-surface);
    box-shadow:0 0 0 1px var(--c), var(--md-elev-1); pointer-events:none; }
  #map.far .bus .run { display:none; }
  .bus .flag { position:absolute; right:calc(100% - 8px); top:-10px; min-width:16px; height:16px; padding:0 4px; border-radius:8px;
    font:500 11px/16px Roboto, sans-serif; text-align:center; }
  .bus.midroute { box-shadow:0 0 0 2px var(--halo), 0 0 0 5px #BA1A1A, var(--md-elev-2); }
  .bus.midroute .flag { background:#BA1A1A; color:#fff; }
  .bus.terminus, .bus.layover { opacity:.8; box-shadow:0 0 0 2px var(--halo), var(--md-elev-1); }
  .bus.terminus .flag, .bus.layover .flag { background:#44474E; color:#fff; }
  .bus.midroute .arrow, .bus.terminus .arrow, .bus.layover .arrow { display:none; }
  .bus.stale { opacity:.45; }
  /* on a stretch no stop reports on: position dead-reckoned from its last GPS */
  .bus.blind { opacity:.75; box-shadow:0 0 0 2px var(--halo), 0 0 0 4px var(--c), var(--md-elev-1); outline:2px dashed var(--halo); outline-offset:3px; }
  /* a scheduled departure no known bus will take: hollow, at the terminus */
  .bus.pending { background:var(--md-surface-container-high) !important; color:var(--md-on-surface) !important;
    box-shadow:inset 0 0 0 3px var(--c), 0 0 0 2px var(--halo), var(--md-elev-1); }
  .bus.pending .flag { background:var(--md-surface-container-highest); color:var(--md-on-surface); }
  .selstop { width:22px; height:22px; border-radius:50%; background:var(--md-primary); border:4px solid var(--halo); box-shadow:var(--md-elev-2); }
  .me { width:18px; height:18px; border-radius:50%; background:#1A73E8; border:3px solid var(--halo); box-shadow:0 0 0 8px rgba(26,115,232,.2); }

  /* M3 bottom sheet */
  #sheet { position:fixed; z-index:1000; left:0; right:0; bottom:0; max-height:52vh; display:flex; flex-direction:column;
    background:var(--md-surface-container-low); border-radius:28px 28px 0 0; box-shadow:var(--md-elev-1); transition:max-height .25s ease; }
  #sheet.full { max-height:88vh; }
  #sheet.min { max-height:calc(36px + 28px + var(--safe-b)); }
  #sheet.min #sheetBody { overflow:hidden; }
  #sheet.drag { transition:none; }
  #grab { flex:none; height:36px; width:100%; border:0; background:none; display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:grab; }
  #grab span { width:32px; height:4px; border-radius:2px; background:var(--md-on-surface-variant); opacity:.4; }
  #sheetBody { overflow:auto; padding:0 16px calc(16px + var(--safe-b)); }
  .kicker { color:var(--md-on-surface-variant); display:flex; justify-content:space-between; gap:8px; align-items:center; }
  h2 { margin:2px 0 0; font:400 24px/32px Roboto, sans-serif; letter-spacing:0; }
  .sub { color:var(--md-on-surface-variant); font-size:14px; margin-top:4px; }
  .row { display:flex; align-items:center; gap:16px; min-height:56px; width:100%; border:0; border-radius:12px;
    background:none; padding:8px 8px; margin:0 -8px; width:calc(100% + 16px); text-align:left; color:var(--md-on-surface); }
  .row:not(:disabled):hover { background:color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
  .row:not(:disabled):active { background:color-mix(in srgb, var(--md-on-surface) 12%, transparent); }
  .badge { flex:none; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--c); color:var(--k); font:500 16px Roboto, sans-serif; }
  .grow { flex:1; min-width:0; }
  .grow b { display:block; font:400 16px/24px Roboto, sans-serif; letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note { font:400 14px/20px Roboto, sans-serif; letter-spacing:.25px; color:var(--md-on-surface-variant); }
  .eta { font:400 22px/28px Roboto, sans-serif; min-width:48px; text-align:right; }
  .op { font:400 12px/16px Roboto, sans-serif; color:var(--md-on-surface-variant); min-width:64px; text-align:right; }
  .faded { opacity:.6; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-top:16px; }
  .grid > div { background:var(--md-surface-container-high); border-radius:12px; padding:12px 16px; min-width:0; }
  .grid .v { font:400 22px/28px Roboto, sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .btn { height:40px; padding:0 24px; border-radius:20px; border:1px solid var(--md-outline); background:transparent;
    color:var(--md-primary); font:500 14px/20px Roboto, sans-serif; letter-spacing:.1px; }
  .btn:hover { background:color-mix(in srgb, var(--md-primary) 8%, transparent); }
  .btn.primary { background:var(--md-primary); color:var(--md-on-primary); border-color:transparent; }
  .btn.on { background:var(--md-secondary-container); color:var(--md-on-secondary-container); border-color:transparent; }
  .empty { color:var(--md-on-surface-variant); padding:16px 0; font-size:14px; }
  .later { font-size:14px; color:var(--md-on-surface-variant); padding:12px 0 4px; line-height:22px; }
  .pchips { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .pchip { display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px 0 4px; border-radius:8px;
    background:var(--md-surface-container-high); font:500 14px/20px Roboto, sans-serif; }
  .pchip .badge { width:24px; height:24px; font-size:12px; }
  .pchip.sched { background:transparent; border:1px solid var(--md-outline-variant); color:var(--md-on-surface-variant); }

  /* overlays: search view and full-screen dialog */
  .overlay { position:fixed; z-index:1100; inset:0; background:var(--md-surface); display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top); }
  .ohead { display:flex; gap:4px; padding:8px 8px 8px 16px; align-items:center; min-height:64px; }
  .ohead input { flex:1; min-width:0; height:56px; border-radius:28px; background:var(--md-surface-container-high);
    border:0; padding:0 20px; outline:none; font-size:16px; }
  .ohead input:focus { box-shadow:inset 0 0 0 2px var(--md-primary); }
  .obody { overflow:auto; padding:4px 16px calc(24px + var(--safe-b)); }
  .obody h3 { font:500 14px/20px Roboto, sans-serif; letter-spacing:.1px; color:var(--md-primary); margin:24px 0 8px; }
  .obody p { color:var(--md-on-surface-variant); font-size:14px; line-height:20px; margin:6px 0; }
  .seg { display:inline-flex; border:1px solid var(--md-outline); border-radius:20px; overflow:hidden; }
  .seg button { height:40px; padding:0 20px; border:0; background:none; font:500 14px Roboto, sans-serif; color:var(--md-on-surface); }
  .seg button + button { border-left:1px solid var(--md-outline); }
  .seg button[aria-pressed=true] { background:var(--md-secondary-container); color:var(--md-on-secondary-container); }
  .stat { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:8px; }
  .stat > div { background:var(--md-surface-container-high); border-radius:12px; padding:12px; }
  .stat .v { font:400 22px/28px Roboto, sans-serif; }
  a { color:var(--md-primary); }
  :focus-visible { outline:2px solid var(--md-primary); outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  /* compass: needle points north on screen; tap to turn the map back to north */
  #compass { position:fixed; z-index:1000; right:16px; top:calc(max(12px, env(safe-area-inset-top)) + 116px);
    width:40px; height:40px; border:0; border-radius:50%; padding:0; display:flex; align-items:center; justify-content:center;
    background:var(--md-surface-container-high); color:var(--md-on-surface-variant); box-shadow:var(--md-elev-2); transition:opacity .2s; }
  #compass.north { opacity:.7; }
  #locate { position:fixed; z-index:1000; right:16px; width:56px; height:56px; border:0; border-radius:16px;
    background:var(--md-primary-container); color:var(--md-on-primary-container); box-shadow:var(--md-elev-3);
    display:flex; align-items:center; justify-content:center; }
  #toast { position:fixed; z-index:1200; left:16px; right:16px; bottom:calc(56vh); margin:0 auto; max-width:400px;
    background:var(--md-inverse-surface); color:var(--md-inverse-on-surface); border-radius:4px;
    padding:14px 16px; font-size:14px; box-shadow:var(--md-elev-3); }
  @media (min-width: 720px) {
    #sheet { left:16px; right:auto; width:400px; bottom:16px; max-height:70vh; border-radius:28px; }
    #sheet.full { max-height:calc(100vh - 150px); }
    #compass { top:16px; }
    #top { right:auto; width:432px; }
    #toast { bottom:24px; left:auto; right:24px; }
  }
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div id="top">
  <div class="bar">
    <button class="field" id="openSearch">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span data-t="searchPh"></span>
    </button>
    <button class="sq mono" id="live" data-t-title="liveTitle">● —</button>
    <button class="sq" id="openMenu" data-t-aria="menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div id="chips" role="group" data-t-aria="lines"></div>
</div>

<button id="compass" class="north" data-t-aria="north" data-t-title="north">
  <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 L16 12 L8 12 Z" fill="#D93025"/><path d="M12 21.5 L16 12 L8 12 Z" fill="currentColor"/></svg>
</button>
<button id="locate" data-t-aria="locate">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
</button>

<section id="sheet" aria-live="polite">
  <button id="grab" data-t-aria="expand"><span></span></button>
  <div id="sheetBody"></div>
</section>

<div class="overlay hide" id="search" role="dialog" aria-modal="true" data-t-aria="search">
  <div class="ohead">
    <label for="q" class="sr" data-t="searchPh"></label>
    <input id="q" type="search" autocomplete="off" enterkeyhint="search">
    <button class="sq" id="closeSearch" data-t-aria="close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="obody" id="results"></div>
</div>

<div class="overlay hide" id="menu" role="dialog" aria-modal="true" data-t-aria="menu">
  <div class="ohead">
    <div style="flex:1; font:400 22px/28px Roboto, sans-serif">NoSePol</div>
    <button class="sq" id="closeMenu" data-t-aria="close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="obody" id="menuBody"></div>
</div>
<div id="toast" class="hide" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script>
// ---------- i18n ----------
const T = {
  it: {
    searchPh: "Fermata, via o linea", liveTitle: "Secondi dall'ultimo aggiornamento GPS", menu: "Menu", lines: "Linee",
    locate: "Centra su di me", north: "Ruota la mappa verso nord", expand: "Espandi", close: "Chiudi", search: "Cerca",
    nearest: "Fermata più vicina", walk: "a piedi", tapHint: "Tocca un autobus o una fermata sulla mappa.",
    locHint: "Attiva la posizione per vedere la fermata più vicina.", locBtn: "Usa la mia posizione",
    stop: "Fermata", bus: "Autobus", now: "ora", stopped: "fermo", gpsOld: "GPS di {s} s fa",
    stoppedMid: "fermo da {m}, possibile problema", stoppedFor: "fermo da {m}", atTerminus2: "al capolinea da {m}", waiting: "in attesa",
    layover: "al capolinea da {m}", leavesAt: "probabilmente riparte alle {time} → {dest}",
    busWaiting: "autobus già in attesa al capolinea",
    away: "a {d}", ours: "NoSePol", operator: "Operatore", noBuses: "Nessun autobus in arrivo adesso.",
    later: "Poi, da orario", scheduled: "programmato", passed: "già passato",
    to: "verso", reaches: "Alla prossima fermata {name} tra {eta}", atTerminus: "Al capolinea",

  const start = (y, target) => {
    fromBody = !$("grab").contains(target);
    y0 = y; h0 = sheet.offsetHeight; active = false; dragged = false; lastY = y; lastT = performance.now(); vy = 0;
  };
  const move = (y, e) => {
    if (y0 == null) return;
    const dy = y - y0;
    if (!active) {
      if (Math.abs(dy) < 8) return;
      // from the content: only a pull down at the top, or a push up while not full, moves the sheet
      if (fromBody && (dy > 0 ? body.scrollTop > 0 : sheetHeight() === "full")) { y0 = null; return; }
      active = dragged = true; sheet.classList.add("drag");
    }
    if (e.cancelable) e.preventDefault();
    const now = performance.now();
    vy = (y - lastY) / Math.max(1, now - lastT); lastY = y; lastT = now;
    sheet.style.maxHeight = Math.max(40, Math.min(innerHeight * .92, h0 - dy)) + "px";
    placeLocate();
  };
  const end = () => {
    if (y0 == null) return;
    y0 = null;
    if (!active) return;
    sheet.classList.remove("drag");
    const h = sheet.offsetHeight; sheet.style.maxHeight = "";
    const cur = sheetHeight(), order = ["min", "normal", "full"];
    let i = order.indexOf(cur);
    // a flick, or a drag past 60 px: one step that way (two for a long drag from full/min)
    if (Math.abs(vy) > 0.4) i += vy < 0 ? 1 : -1;
    else if (Math.abs(h - h0) > 60) i += (h > h0 ? 1 : -1) * (Math.abs(h - h0) > innerHeight * .45 ? 2 : 1);
    setHeight(order[Math.max(0, Math.min(2, i))]);
    setTimeout(() => { dragged = false; }, 0);
  };
  sheet.addEventListener("touchstart", e => start(e.touches[0].clientY, e.target), { passive: true });
  sheet.addEventListener("touchmove", e => move(e.touches[0].clientY, e), { passive: false });
  sheet.addEventListener("touchend", end); sheet.addEventListener("touchcancel", end);
  // mouse: from the handle only
  $("grab").addEventListener("mousedown", e => {
    start(e.clientY, e.target);
    const mm = ev => move(ev.clientY, ev), mu = () => { end(); removeEventListener("mousemove", mm); removeEventListener("mouseup", mu); };
    addEventListener("mousemove", mm); addEventListener("mouseup", mu);
  });
  // a tap that ended a drag is not a tap on a row
  sheet.addEventListener("click", e => { if (dragged) { e.stopPropagation(); e.preventDefault(); } }, true);
})();
function setSheet(html, accent) {
  body.innerHTML = html;
  sheet.style.setProperty("--accent", accent || "var(--edge)");
  placeLocate();
}
function placeLocate() { $("locate").style.bottom = (sheet.offsetHeight + 12) + "px"; }
// Centre a point in the part of the map the sheet doesn't cover.
function focusOn(latlng, zoom) {
  const z = Math.max(map.getZoom(), zoom);
  const covered = innerWidth >= 720 ? 0 : sheet.offsetHeight;
  // the offset is "down on screen": turn it into the (unrotated) map's pixel frame
  const b = (map.getBearing ? map.getBearing() : 0) * Math.PI / 180;
  const off = L.point(Math.sin(b) * covered / 2, Math.cos(b) * covered / 2);
  const p = map.project(latlng, z).add(off);
  map.setView(map.unproject(p, z), z);
}
new ResizeObserver(placeLocate).observe(sheet);

function peek() {
  clearTimers();
  sel = null; follow = false; setHeight("normal");
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  drawBuses();
  if (!me) {
    setSheet(`<div class="kicker mono"><span>NoSePol · Trieste</span></div>
      <p class="sub" style="margin:8px 0 12px">${esc(t("tapHint"))} ${esc(t("locHint"))}</p>
      <button class="btn" id="useLoc" style="width:100%">${esc(t("locBtn"))}</button>`);
    $("useLoc").onclick = locate;
    return;
  }
  api(`stops?near=${me[0].toFixed(5)},${me[1].toFixed(5)}&limit=1`).then(async ([st]) => {
    if (!st || sel) return;
    const d = await api("stops/" + st.code);
    if (sel) return;
    const deps = d.departures.slice(0, 4);
    setSheet(`<button class="row" id="peekStop" style="border-top:0; display:block">
        <div class="kicker mono"><span>${esc(t("nearest"))} · ${fmtDist(st.dist)} · ${walkMin(st.dist)}′ ${esc(t("walk"))}</span></div>
        <h2>${esc(st.name)}</h2></button>
      <div class="pchips">${deps.map(x => {
        const eta = x.eta_s ?? x.operator_eta_s;
        return `<span class="pchip ${x.live ? "" : "sched"}">${badge(x.line)}${x.stopped_s ? esc(stopShort(x)) : fmtEta(eta)}</span>`;
      }).join("") || `<span class="empty">${esc(t("noBuses"))}</span>`}</div>`);
    $("peekStop").onclick = () => openStop(st.code);
  }).catch(() => {});
}

let stopTimer = null, busTimer = null, selStop = null;
function clearTimers() {
  clearInterval(stopTimer); clearInterval(busTimer); stopTimer = busTimer = null;
  if (selStop) { selStop.remove(); selStop = null; }
}

async function openStop(code, { pan = true } = {}) {
  clearTimers(); follow = false;
  if (pan && sheetHeight() === "min") setHeight("normal");
  sel = { type: "stop", id: code };
  history.replaceState(null, "", "#/stop/" + encodeURIComponent(code));
  drawBuses();
  const render = async first => {
    let d;
    try { d = await api("stops/" + encodeURIComponent(code)); }
    catch { if (first) setSheet(`<p class="empty">${esc(t("unknownStop"))}</p>`); return; }
    if (sel?.type !== "stop" || sel.id !== code) return;
    if (first) {
      selStop = L.marker([d.lat, d.lon], { interactive: false, zIndexOffset: 500,
        icon: L.divIcon({ className: "", html: '<div class="selstop"></div>', iconSize: [22, 22] }) }).addTo(map);
      if (pan) requestAnimationFrame(() => focusOn([d.lat, d.lon], 16));
    }
    const walk = me ? haversine(me, [d.lat, d.lon]) : null;
    const rows = d.departures.map(x => {
      const eta = x.eta_s != null ? fmtEta(x.eta_s) : x.stopped_s ? stopShort(x) : x.live ? "–"
        : x.operator_eta_s != null ? fmtEta(x.operator_eta_s) : (x.scheduled || "–");
      const note = x.live
        ? [x.stopped_s ? stopText(x) : null, x.stale ? t("gpsOld", { s: x.age }) : null, x.dist != null ? t("away", { d: fmtDist(x.dist) }) : null].filter(Boolean).join(" · ")
        : `${t("scheduled")}${x.scheduled ? " " + x.scheduled : ""}${x.waiting_bus ? " · " + t("busWaiting") : ""}`;
      const warn = x.stop_kind === "midroute" && x.stopped_s >= ALARM_S ? ' style="color:var(--orange)"' : "";
      return `<button class="row ${x.stale || (!x.live && !x.waiting_bus) || x.stop_kind === "terminus" ? "faded" : ""}" ${x.live ? `data-trip="${esc(x.trip)}"` : "disabled"}>
        ${badge(x.line)}<div class="grow"><b>${esc(x.destination)}</b><span class="note"${warn}>${esc(note)}</span></div>
        <span class="eta"${warn}>${esc(eta)}</span><span class="op">${esc(x.operator ?? "")}</span></button>`;
    }).join("");
    const later = d.later.filter(x => x.times.length).map(x =>
      `<div>${esc(style(x.line).name)} → ${esc(x.destination)}: ${x.times.slice(0, 4).map(esc).join(" · ")}</div>`).join("");
    setSheet(`<div class="kicker mono"><span>${esc(t("stop"))}${walk != null ? ` · ${fmtDist(walk)} · ${walkMin(walk)}′ ${esc(t("walk"))}` : ""}</span>
        <button class="sq" id="closeSheet" aria-label="${esc(t("close"))}" style="width:44px;height:44px;border:0;background:none;margin-right:-10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <h2>${esc(d.name)}</h2>
      <div style="display:flex;gap:6px;margin-top:8px">${d.lines.map(badge).join("")}</div>
      <div class="kicker mono" style="margin-top:14px"><span></span><span style="display:flex;gap:10px"><span style="min-width:48px;text-align:right">${esc(t("ours"))}</span><span style="min-width:58px;text-align:right">${esc(t("operator"))}</span></span></div>
      <div style="margin-top:4px">${rows || `<p class="empty">${esc(t("noBuses"))}</p>`}</div>
      ${later ? `<div class="later"><div class="mono" style="color:var(--muted);margin-bottom:4px">${esc(t("later"))}</div>${later}</div>` : ""}
      <div class="actions"><button class="btn" id="shareBtn">${esc(t("share"))}</button><button class="btn primary" id="expandBtn">${esc(t("allDeps"))}</button></div>`, "#ECEAE3");
    $("closeSheet").onclick = peek;
    $("shareBtn").onclick = share;
    $("expandBtn").onclick = () => setHeight("full");
    for (const r of body.querySelectorAll("[data-trip]")) r.onclick = () => openBus(r.dataset.trip, { from: code });
  };
  await render(true);
  stopTimer = setInterval(render, 10000);
}

async function openBus(trip, { pan = true, from = null } = {}) {
  clearTimers();
  if (pan && sheetHeight() === "min") setHeight("normal");
  if (!(sel?.type === "bus" && sel.id === trip)) follow = false;
  sel = { type: "bus", id: trip, from: from ?? (sel?.type === "bus" && sel.id === trip ? sel.from : null) };
  history.replaceState(null, "", "#/bus/" + encodeURIComponent(trip));
  drawBuses();
  const render = async first => {
    let d;
    try { d = await api("trips/" + encodeURIComponent(trip)); }
    catch { if (first) setSheet(`<p class="empty">${esc(t("unknownTrip"))}</p><button class="btn" id="back" style="width:100%">${esc(t("close"))}</button>`); $("back") && ($("back").onclick = peek); return; }
    if (sel?.type !== "bus" || sel.id !== trip) return;
    if (first && pan) requestAnimationFrame(() => focusOn([d.lat, d.lon], 15));
    const s = style(d.line), [conf, confColor] = confidence(d);
    const ns = d.stops_ahead[0];
    const head = d.stopped_s || d.stop_kind === "layover" ? `<b style="color:${d.stop_kind === "midroute" && d.stopped_s >= ALARM_S ? "var(--orange)" : "var(--fg)"}">${esc(stopText(d))}</b>`
      : (ns ? esc(t("reaches", { name: ns.name, eta: fmtEta(ns.eta_s) })) : esc(t("atTerminus")))
        + (d.next_run ? " · " + esc(t("thenLeaves", { time: d.next_run.scheduled, dest: d.next_run.destination })) : "")
        + (d.blind ? " · " + esc(t("blind")) : "");
    const ahead = d.stops_ahead.slice(0, 12).map(x => {
      const clock = x.eta_s != null ? new Date((d.t + x.eta_s) * 1000).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" }) : "";
      const mine = sel.from === x.code;
      return `<button class="row" data-stop="${esc(x.code ?? "")}" ${x.code ? "" : "disabled"} style="min-height:44px">
        <span style="width:12px;height:12px;flex:none;border-radius:50%;border:2px solid ${mine ? "var(--md-primary)" : "var(--md-outline)"};background:${mine ? "var(--md-primary)" : "transparent"}"></span>
        <span class="grow" style="font-weight:${mine ? 500 : 400}">${esc(x.name)}</span>
        <span class="note">${esc(clock)}</span><span class="eta" style="font-size:16px">${esc(fmtEta(x.eta_s))}</span></button>`;
    }).join("");
    setSheet(`<div class="kicker mono"><span>${esc(t("bus"))} · ${esc(d.trip)} · ${esc(t("gps"))} ${d.age}s</span>
        <button class="sq" id="closeSheet" aria-label="${esc(t("close"))}" style="width:44px;height:44px;border:0;background:none;margin-right:-10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <h2 style="display:flex;align-items:center;gap:12px">${badge(d.line)}<span>${esc(d.destination)}</span></h2>
      <div class="sub">${head}${d.api_arrival ? ` · ${esc(t("operator"))}: ${esc(d.api_arrival)}` : ""}</div>
      <div class="grid">
        <div><div class="mono" style="color:var(--muted)">${esc(t("speed"))}</div><div class="v">${d.v == null ? "–" : Math.round(d.v * 3.6) + " km/h"}</div></div>
        <div><div class="mono" style="color:var(--muted)">${esc(t("next"))}</div><div class="v">${ns ? fmtDist(ns.dist) : "–"}</div></div>
        <div><div class="mono" style="color:var(--muted)">${esc(t("confidence"))}</div><div class="v" style="color:${confColor}">${esc(t(conf))}</div></div>
        <div><div class="mono" style="color:var(--muted)">KM</div><div class="v">${(d.s / 1000).toFixed(1)}/${(d.length / 1000).toFixed(1)}</div></div>
      </div>
      <div class="actions"><button class="btn ${follow ? "on" : ""}" id="followBtn">${esc(t(follow ? "following" : "follow"))}</button><button class="btn" id="shareBtn">${esc(t("share"))}</button></div>
      <div class="mono" style="color:var(--muted);margin-top:16px">${esc(t("stopsAhead"))}</div>
      <div style="margin-top:4px">${ahead}</div>`, s.color);
    $("closeSheet").onclick = peek;
    $("shareBtn").onclick = share;
    $("followBtn").onclick = () => { follow = !follow; render(); if (follow) focusOn([d.lat, d.lon], 15); };
    for (const r of body.querySelectorAll("[data-stop]")) if (r.dataset.stop) r.onclick = () => openStop(r.dataset.stop);
  };
  await render(true);
  busTimer = setInterval(render, 10000);
}

async function share() {
  const url = location.href;
  try {
    if (navigator.share) await navigator.share({ title: "NoSePol", url });
    else { await navigator.clipboard.writeText(url); toast(t("copied")); }
  } catch {}
}

// ---------- search ----------
let searchSeq = 0;
function openSearch() {
  $("search").classList.remove("hide"); $("q").value = ""; $("q").focus(); runSearch();
}
function closeSearch() { $("search").classList.add("hide"); }
async function runSearch() {
  const q = $("q").value.trim(), seq = ++searchSeq;
  let path, title = "";
  if (q) path = `stops?q=${encodeURIComponent(q)}&limit=30` + (me ? `&near=${me[0].toFixed(5)},${me[1].toFixed(5)}` : "");
  else if (me) { path = `stops?near=${me[0].toFixed(5)},${me[1].toFixed(5)}&limit=12`; title = t("nearby"); }
  else { $("results").innerHTML = `<p class="empty">${esc(t("typeHint"))}</p>`; return; }
  let res = [];
  try { res = await api(path); } catch {}
  if (seq !== searchSeq) return;
  const lineHits = q ? Object.entries(LINES).filter(([l, s]) => s.name === q.replace(/^0+/, "") || l.toLowerCase() === q.toLowerCase()) : [];
  $("results").innerHTML = (title ? `<h3>${esc(title)}</h3>` : "") +
    lineHits.map(([l, s]) => `<button class="row" data-line="${l}">${badge(l)}<div class="grow"><b>${esc(t("lines"))} ${esc(s.name)}</b><span class="note">${esc([...new Set(s.variants.map(v => v.headsign))].join(" ⇄ "))}</span></div></button>`).join("") +
    (res.map(r => `<button class="row" data-code="${esc(r.code)}"><div class="grow"><b>${esc(r.name)}</b>
      <span class="note">${r.dist != null ? fmtDist(r.dist) + " · " : ""}${esc(r.code)}</span></div>
      <span style="display:flex;gap:4px">${r.lines.map(l => { const s = style(l); return `<span style="background:${s.color};color:${s.ink};font:500 12px/24px Roboto,sans-serif;min-width:24px;height:24px;border-radius:12px;text-align:center;padding:0 6px">${esc(s.name)}</span>`; }).join("")}</span></button>`).join("")
      || (lineHits.length ? "" : `<p class="empty">${esc(t("noResults"))}</p>`));
  for (const b of $("results").querySelectorAll("[data-code]")) b.onclick = () => { closeSearch(); openStop(b.dataset.code); };
  for (const b of $("results").querySelectorAll("[data-line]")) b.onclick = () => { closeSearch(); showOnly(b.dataset.line); };
}
$("openSearch").onclick = openSearch;
$("closeSearch").onclick = closeSearch;
$("q").oninput = () => { clearTimeout(runSearch.h); runSearch.h = setTimeout(runSearch, 200); };

// ---------- menu: lines, language, status, about ----------
function showOnly(line) {
  hidden.clear(); for (const l of Object.keys(LINES)) if (l !== line) hidden.add(l);
  saveHidden(); applyFilter();
  const g = shapeLayers[line]; if (g) { const b = L.featureGroup(g.getLayers()).getBounds(); if (b.isValid()) map.fitBounds(b, { padding: [30, 30] }); }
}
async function openMenu() {
  $("menu").classList.remove("hide");
  let st = null; try { st = await api("status"); } catch {}
  const lines = Object.entries(LINES).map(([l, s]) => `<button class="row" data-line="${l}">${badge(l)}
      <div class="grow"><b>${esc([...new Set(s.variants.map(v => v.headsign))].join(" ⇄ ") || l)}</b>
      <span class="note">${esc(t("busesRunning", { n: s.vehicles }))}${s.pending ? " · " + esc(t("pendingN", { n: s.pending })) : ""} · ${esc(t("showOnly"))}</span></div></button>`).join("");
  $("menuBody").innerHTML = `<h3>${esc(t("linesTitle"))}</h3>${lines}
    <h3>${esc(t("language"))}</h3>
    <div class="seg" role="group" aria-label="${esc(t("language"))}"><button data-lang="it" aria-pressed="${lang === "it"}">Italiano</button><button data-lang="en" aria-pressed="${lang === "en"}">English</button></div>
    <h3>${esc(t("theme"))}</h3>
    <div class="seg" role="group" aria-label="${esc(t("theme"))}">${["system", "light", "dark"].map(k =>
      `<button data-theme-pick="${k}" aria-pressed="${theme === k}">${esc(t("theme" + k[0].toUpperCase() + k.slice(1)))}</button>`).join("")}</div>
    <h3>${esc(t("feed"))}</h3>
    ${st ? `<div class="stat">
      <div><div class="mono" style="color:var(--muted)">${esc(t("lastBatch"))}</div><div class="v">${st.last_batch_age ?? "–"} s</div></div>
      <div><div class="mono" style="color:var(--muted)">${esc(t("every"))}</div><div class="v">~${st.batch_interval ?? "–"} s</div></div>
      <div><div class="mono" style="color:var(--muted)">${esc(t("staleN"))}</div><div class="v">${st.stale} / ${st.buses}</div></div></div>
      ${st.resync_suggested ? `<p style="color:var(--orange)">${esc(t("resync"))}</p>` : ""}` : `<p>${esc(t("offline"))}</p>`}
    <h3>${esc(t("howTitle"))}</h3><p>${esc(t("how"))}</p>
    <h3>${esc(t("privacyTitle"))}</h3><p>${esc(t("privacy"))}</p>
    <h3>${esc(t("installTitle"))}</h3><p>${esc(t("install"))}</p>`;
  for (const b of $("menuBody").querySelectorAll("[data-line]")) b.onclick = () => { closeMenu(); showOnly(b.dataset.line); };
  for (const b of $("menuBody").querySelectorAll("[data-lang]")) b.onclick = () => { lang = b.dataset.lang; store.set("lang", lang); applyLang(); openMenu(); rerender(); };
  for (const b of $("menuBody").querySelectorAll("[data-theme-pick]")) b.onclick = () => {
    theme = b.dataset.themePick; store.set("theme", theme); applyTheme();
    for (const x of $("menuBody").querySelectorAll("[data-theme-pick]")) x.setAttribute("aria-pressed", x === b);
  };
}
function closeMenu() { $("menu").classList.add("hide"); }
$("openMenu").onclick = openMenu;
$("closeMenu").onclick = closeMenu;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSearch(); closeMenu(); } });

// ---------- location ----------
function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    me = [p.coords.latitude, p.coords.longitude];
    if (!meMarker) meMarker = L.marker(me, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16] }), interactive: false }).addTo(map);
    else meMarker.setLatLng(me);
    focusOn(me, 16);
    if (!sel) peek();
  }, () => toast(t("locHint")), { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
}
$("locate").onclick = locate;

// ---------- routing & polling ----------
function route() {
  const m = location.hash.match(/^#\/(stop|bus)\/(.+)$/);
  if (!m) return peek();
  const id = decodeURIComponent(m[2]);
  m[1] === "stop" ? openStop(id) : openBus(id);
}
function rerender() { if (sel?.type === "stop") openStop(sel.id, { pan: false }); else if (sel?.type === "bus") openBus(sel.id, { pan: false }); else peek(); drawBuses(); }
window.addEventListener("hashchange", () => { if (!location.hash.startsWith(`#/${sel?.type}/`)) route(); });

let knownVariants = -1;
async function tick() {
  try {
    const data = await api("vehicles");
    vehicles = data.vehicles;
    pendingDeps = data.pending || [];
    drawBuses();
    if (follow && sel?.type === "bus") { const v = vehicles.find(x => x.trip === sel.id); if (v) focusOn([v.lat, v.lon], 0); }
    const freshest = Math.min(...vehicles.map(v => v.age).filter(a => a != null), 999);
    $("live").textContent = vehicles.length ? `● ${freshest}s` : "● —";
    $("live").classList.toggle("bad", freshest > 60);
    const nv = await loadLines();
    if (nv !== knownVariants) { knownVariants = nv; await loadShapes(); }
  } catch {
    $("live").textContent = "● ✕"; $("live").classList.add("bad");
  }
}

applyLang();
stopVisibility();
runVisibility();
addEventListener("load", () => map.invalidateSize());  // fonts/viewport can settle after init
tick().then(route);
setInterval(tick, 3000);
</script>
</body>
</html>
